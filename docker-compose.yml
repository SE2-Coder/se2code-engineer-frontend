services:
  astro:
    build: .
    container_name: se2code-astro
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: "production"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "587"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      CONTACT_EMAIL: "${CONTACT_EMAIL}"
    networks:
      - frontend-net

networks:
  frontend-net:
